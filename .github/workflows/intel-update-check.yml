name: Intel Update Check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1-5"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch public CTI update candidates
        run: python3 scripts/fetch_intel_updates.py
        env:
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          MISP_API_KEY: ${{ secrets.MISP_API_KEY }}
          OPENCTI_TOKEN: ${{ secrets.OPENCTI_TOKEN }}

      - name: Upload update queue artifact
        uses: actions/upload-artifact@v4
        with:
          name: intel-update-candidates
          path: |
            data/intel-update-candidates.csv
            docs/intelligence-updates.md
