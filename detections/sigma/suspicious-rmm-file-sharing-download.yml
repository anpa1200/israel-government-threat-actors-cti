title: Suspicious RMM Installer Download From User Context
id: 58d38b0e-902c-4b0d-9f3f-0a7b54f8e601
status: experimental
description: Detects download or execution patterns consistent with abuse of legitimate remote monitoring and management tools from user-controlled locations.
references:
  - https://attack.mitre.org/techniques/T1219/
  - https://attack.mitre.org/groups/G0069/
author: Andrey
date: 2026/05/13
tags:
  - attack.command_and_control
  - attack.t1219
  - attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection_process:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\msiexec.exe'
      - '\curl.exe'
      - '\bitsadmin.exe'
      - '\certutil.exe'
  selection_rmm_terms:
    CommandLine|contains:
      - 'anydesk'
      - 'screenconnect'
      - 'connectwise'
      - 'atera'
      - 'splashtop'
      - 'syncro'
      - 'tacticalrmm'
  selection_user_path:
    CommandLine|contains:
      - '\Users\'
      - '\Downloads\'
      - '\AppData\Local\Temp\'
  filter_admin_tools:
    CommandLine|contains:
      - 'approved-rmm'
      - 'softwaredeployment'
  condition: all of selection_* and not filter_admin_tools
fields:
  - UtcTime
  - Computer
  - User
  - Image
  - ParentImage
  - CommandLine
falsepositives:
  - Approved enterprise RMM deployment or helpdesk installation.
level: medium
