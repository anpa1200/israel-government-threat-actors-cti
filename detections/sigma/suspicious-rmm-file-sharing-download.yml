title: Suspicious RMM Installer Download From User Context
id: 58d38b0e-902c-4b0d-9f3f-0a7b54f8e601
status: experimental
description: >
  Detects download or execution patterns consistent with abuse of legitimate remote
  monitoring and management tools from user-controlled locations (MuddyWater / MERCURY
  RMM-abuse tradecraft). REQUIRED before enabling: apply a local allowlist for approved
  deployment parents such as SCCM, Intune, or helpdesk tooling. Without local tuning,
  the rule will generate significant noise from legitimate helpdesk activity.
references:
  - https://attack.mitre.org/techniques/T1219/
  - https://attack.mitre.org/groups/G0069/
author: Andrey
date: 2026-05-13
modified: 2026-05-14
tags:
  - attack.command_and_control
  - attack.t1219
  - attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection_process:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\msiexec.exe'
      - '\curl.exe'
      - '\bitsadmin.exe'
      - '\certutil.exe'
  selection_rmm_terms:
    CommandLine|contains:
      - 'anydesk'
      - 'screenconnect'
      - 'connectwise'
      - 'atera'
      - 'splashtop'
      - 'syncro'
      - 'tacticalrmm'
  selection_user_path:
    CommandLine|contains:
      - '\Users\'
      - '\Downloads\'
      - '\AppData\Local\Temp\'
  condition: all of selection_*
fields:
  - UtcTime
  - Computer
  - User
  - Image
  - ParentImage
  - CommandLine
falsepositives:
  - Approved enterprise RMM deployment or helpdesk installation via authorised parent process.
  - Local deployments should add an environment-specific ParentImage allowlist outside
    this portable prototype rule.
level: medium
