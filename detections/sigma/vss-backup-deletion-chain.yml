title: Shadow Copy Or Backup Deletion Command
id: 7c2b0921-cfb5-4f31-ae85-fac497fa26e2
status: experimental
description: >
  Detects common recovery-inhibition commands used before destructive encryption
  or wiping activity, including vssadmin, wmic shadowcopy, wbadmin, and recycle-bin
  deletion. Treat as behavior-level detection and correlate with privilege changes,
  EDR tampering, and high-volume file operations.
references:
  - https://www.microsoft.com/en-us/security/blog/2023/04/07/mercury-and-dev-1084-destructive-attack-on-hybrid-environment/
  - https://attack.mitre.org/techniques/T1490/
author: Andrey
date: 2026-05-14
tags:
  - attack.impact
  - attack.t1490
logsource:
  product: windows
  category: process_creation
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'
  selection_wbadmin:
    Image|endswith: '\wbadmin.exe'
    CommandLine|contains:
      - 'delete'
      - 'backup'
      - 'catalog'
  selection_recycle_bin:
    Image|endswith: '\cmd.exe'
    CommandLine|contains|all:
      - '$Recycle.Bin'
      - '/s'
      - '/q'
  condition: 1 of selection_*
fields:
  - UtcTime
  - Computer
  - User
  - Image
  - ParentImage
  - CommandLine
falsepositives:
  - Approved disaster-recovery testing.
  - Backup maintenance scripts run by authorized infrastructure teams.
level: high
