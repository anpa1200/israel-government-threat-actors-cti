title: Liontail-Style System32 DLL Placement Or Service Load
id: 93f92a6d-c1a6-4f3c-b0d5-2cf9da3b3f76
status: experimental
description: >
  Detects writes or service-control activity involving DLL names highlighted in
  Scarred Manticore / Liontail reporting. This rule is a prototype for IIS-adjacent
  passive backdoor hunting and should be correlated with HTTP.sys listener and web
  server telemetry.
references:
  - https://research.checkpoint.com/2023/scarred-manticore-versus-mois-seeing-the-invisible/
author: Andrey
date: 2026-05-14
tags:
  - attack.persistence
  - attack.t1574.001
  - attack.t1543.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_service_control:
    Image|endswith:
      - '\sc.exe'
      - '\powershell.exe'
      - '\cmd.exe'
    CommandLine|contains:
      - 'Eaphost'
      - 'IKEEXT'
      - 'PolicyAgent'
      - 'wlanapi.dll'
      - 'wlbsctrl.dll'
  condition: selection_service_control
fields:
  - UtcTime
  - Computer
  - User
  - Image
  - ParentImage
  - CommandLine
falsepositives:
  - Legitimate Windows service troubleshooting by administrators.
  - Operating system repair or network-service maintenance.
level: high
