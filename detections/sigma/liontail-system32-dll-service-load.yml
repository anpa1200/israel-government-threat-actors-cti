title: Suspicious Service Control For Phantom DLL Hijack Targets
id: 93f92a6d-c1a6-4f3c-b0d5-2cf9da3b3f76
status: experimental
description: >
  Detects service-control activity involving Windows services and DLL names that have
  been highlighted in public Iranian intrusion reporting as phantom-DLL hijack targets.
  This is not a complete Liontail detector; correlate with IIS native-module integrity,
  HTTP.sys listener, and web-server telemetry for Scarred Manticore investigations.
references:
  - https://research.checkpoint.com/2023/scarred-manticore-versus-mois-seeing-the-invisible/
author: Andrey
date: 2026-05-14
tags:
  - attack.persistence
  - attack.t1574.001
  - attack.t1543.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_service_control:
    Image|endswith:
      - '\sc.exe'
      - '\powershell.exe'
      - '\cmd.exe'
    CommandLine|contains:
      - 'Eaphost'
      - 'IKEEXT'
      - 'PolicyAgent'
      - 'wlanapi.dll'
      - 'wlbsctrl.dll'
  condition: selection_service_control
fields:
  - UtcTime
  - Computer
  - User
  - Image
  - ParentImage
  - CommandLine
falsepositives:
  - Legitimate Windows service troubleshooting by administrators.
  - Operating system repair or network-service maintenance.
level: medium
