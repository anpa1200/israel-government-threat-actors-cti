title: Trusted Sender Bulk Phishing Anomaly
id: 5737ccdf-5f23-4058-bd1d-2ca92963c3f8
status: experimental
description: Conceptual mail telemetry rule for previously low-volume trusted senders that suddenly send high-volume external messages with links or attachments.
references:
  - https://www.gov.il/BlobFolder/reports/alert_1947/he/ALERT-CERT-IL-W-1947.pdf
  - https://research.checkpoint.com/2024/hamas-affiliated-threat-actor-expands-to-disruptive-activity/
author: Andrey
date: 2026/05/13
tags:
  - attack.initial_access
  - attack.t1566
logsource:
  product: m365
  service: exchange
detection:
  selection_external:
    RecipientType|contains:
      - 'External'
  selection_content:
    Subject|contains:
      - 'update'
      - 'security'
      - 'urgent'
      - 'patch'
      - 'alert'
  condition: selection_external and selection_content
fields:
  - TimeGenerated
  - SenderFromAddress
  - RecipientEmailAddress
  - Subject
  - UrlCount
  - AttachmentCount
falsepositives:
  - Legitimate advisories from known CERT, IT, vendor, or government communication accounts.
level: medium
