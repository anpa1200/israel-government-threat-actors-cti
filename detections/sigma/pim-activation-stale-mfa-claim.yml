title: Privileged Role Activation Requiring Phishing-Resistant MFA Review
id: 0116b5d3-8e90-48cb-a3de-e8f43c038c11
status: experimental
description: >
  Detects activation of high-privilege roles via PIM (Privileged Identity Management).
  Analysts MUST review whether the activating identity authenticated with phishing-resistant
  MFA (FIDO2/certificate) at activation time. Stale-claim detection — verifying token
  issuance time vs activation time — requires a KQL join against SigninLogs and cannot
  be expressed in Sigma pattern matching; this rule fires on every privileged activation
  as a review trigger, not a confirmed stale-claim detection.
references:
  - https://pushsecurity.com/blog/stryker-handala-report
  - https://attack.mitre.org/techniques/T1078/004/
author: Andrey
date: 2026-05-13
modified: 2026-05-14
tags:
  - attack.persistence
  - attack.t1098
  - attack.t1078.004
logsource:
  product: azure
  service: auditlogs
detection:
  selection_role:
    OperationName|contains:
      - 'Add member to role'
      - 'Activate eligible role'
      - 'Add eligible member'
  selection_privileged:
    TargetResources|contains:
      - 'Global Administrator'
      - 'Intune Administrator'
      - 'Privileged Role Administrator'
      - 'Cloud Device Administrator'
      - 'Exchange Administrator'
  condition: selection_role and selection_privileged
fields:
  - TimeGenerated
  - OperationName
  - InitiatedBy
  - TargetResources
  - Result
falsepositives:
  - Approved PIM activation with phishing-resistant MFA and ticketed change control.
level: medium
