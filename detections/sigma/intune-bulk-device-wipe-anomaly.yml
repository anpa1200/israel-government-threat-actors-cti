title: Intune Bulk Device Wipe Or Retire Anomaly
id: 53fd1734-475f-46fc-a87b-ad74a98e9347
status: experimental
description: Detects high-risk Intune device lifecycle actions that may indicate identity-plane destructive activity.
references:
  - https://pushsecurity.com/blog/stryker-handala-report
  - https://attack.mitre.org/techniques/T1485/
author: Andrey
date: 2026/05/13
tags:
  - attack.impact
  - attack.t1485
  - attack.t1078.004
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    OperationName|contains:
      - 'Wipe'
      - 'Retire'
      - 'Delete device'
      - 'Delete managed device'
  condition: selection
fields:
  - TimeGenerated
  - OperationName
  - InitiatedBy
  - TargetResources
  - Result
falsepositives:
  - Planned device retirement projects or tenant cleanup activity.
level: high
