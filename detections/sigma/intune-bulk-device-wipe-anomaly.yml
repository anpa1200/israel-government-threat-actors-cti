title: Intune Device Wipe Or Retire Action
id: 53fd1734-475f-46fc-a87b-ad74a98e9347
status: experimental
description: >
  Base event selector for Intune device wipe, retire, or delete actions. This Sigma rule
  intentionally does not perform event-count correlation; use the companion KQL query
  detections/kql/intune-bulk-device-wipe-anomaly.kql for thresholded bulk-wipe hunting
  such as identity-plane destructive activity.
references:
  - https://pushsecurity.com/blog/stryker-handala-report
  - https://attack.mitre.org/techniques/T1485/
  - https://attack.mitre.org/techniques/T1072/
author: Andrey
date: 2026-05-13
modified: 2026-05-14
tags:
  - attack.impact
  - attack.t1485
  - attack.t1072
  - attack.t1078.004
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    OperationName|contains:
      - 'Wipe'
      - 'Retire'
      - 'Delete device'
      - 'Delete managed device'
  condition: selection
fields:
  - TimeGenerated
  - OperationName
  - InitiatedBy
  - TargetResources
  - Result
falsepositives:
  - Planned device retirement projects or tenant cleanup activity by authorised IT staff.
    Correlate by InitiatedBy and TargetResources before alerting on impact activity.
level: low
